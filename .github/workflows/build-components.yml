name: Build and test Rilmo components
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-components:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build managed app and native components from source
        shell: pwsh
        run: ./tools/build-component-ci.ps1
      - name: Investigate MSIX camera activation on disposable CI machine
        shell: powershell
        run: ./tools/msix-camera-probe.ps1
      - name: Retain build evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-build-evidence-${{ github.sha }}
          path: artifacts/component-ci/evidence/
          if-no-files-found: error
          retention-days: 14
# No production signing credentials, release download, or Store submission.
# The independent MSIX probe uses a temporary certificate only on the CI runner.
# Full combined-runtime source/licensing and signing approval remain separate gates.
